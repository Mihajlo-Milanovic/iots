services:
  db:
    image: postgres:16-alpine
    container_name: iots-db
    environment:
      POSTGRES_DB: iots
      POSTGRES_USER: iots
      POSTGRES_PASSWORD: iots
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 na hostu da se izbegne sudar sa lokalnim PostgreSQL-om
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iots -d iots"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [iots-net]

  datamanager:
    build:
      context: .
      dockerfile: datamanager/Dockerfile
    image: iots/datamanager:1.0.0
    container_name: iots-datamanager
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: iots
      DB_USER: iots
      DB_PASSWORD: iots
      GRPC_PORT: "50051"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; health_pb2_grpc.HealthStub(grpc.insecure_channel('localhost:50051')).Check(health_pb2.HealthCheckRequest())\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [iots-net]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: iots/gateway:1.0.0
    container_name: iots-gateway
    environment:
      DATAMANAGER_HOST: datamanager
      DATAMANAGER_PORT: "50051"
      SERVER_PORT: "8080"
    depends_on:
      datamanager:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [iots-net]

  generator:
    build:
      context: ./sensor-generator
    image: iots/sensor-generator:1.0.0
    container_name: iots-generator
    environment:
      GATEWAY_URL: http://gateway:8080
      CSV_FILE: /app/data/sensor_data.csv
      RATE: "200"
      BATCH: "100"
      LIMIT: "2000"
    depends_on:
      gateway:
        condition: service_healthy
    profiles: ["tools"]
    networks: [iots-net]

volumes:
  pgdata:

networks:
  iots-net:
    driver: bridge

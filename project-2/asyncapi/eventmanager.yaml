asyncapi: 3.1.0

info:
  title: IoTS EventManager - MQTT API
  version: 1.0.0
  description: |
    EventManager se pretplaćuje na topic sa očitavanjima koji puni DataManager,
    proverava vrednosti u odnosu na predefinisane pragove i, kada je prag
    prekoračen, objavljuje događaj na `iots/events/{deviceId}/{field}`.

    Pragovi se konfigurišu u `thresholds.json` (globalno i po uređaju).
    Ponavljanje istog događaja je ograničeno cooldown periodom (podrazumevano 60 s)
    po kombinaciji uređaj + polje.

servers:
  mosquitto:
    host: mosquitto:1883
    protocol: mqtt
    description: Mosquitto MQTT broker (TCP listener za mikroservise)
  mosquitto-ws:
    host: mosquitto:9001
    protocol: ws
    description: Mosquitto WebSocket listener (MqttClient u pregledaču)

channels:
  readings:
    address: 'iots/readings/{deviceId}'
    title: Očitavanja sa senzora
    description: Ulazni kanal - poruke koje objavljuje DataManager.
    parameters:
      deviceId:
        description: Identifikator (MAC adresa) IoT uređaja
        examples:
          - 'b8:27:eb:bf:9d:51'
    messages:
      reading:
        $ref: '#/components/messages/Reading'

  events:
    address: 'iots/events/{deviceId}/{field}'
    title: Detektovani događaji
    description: Izlazni kanal - događaji o prekoračenju pragova.
    parameters:
      deviceId:
        description: Identifikator uređaja na kojem je događaj detektovan
        examples:
          - '1c:bf:ce:15:ec:4d'
      field:
        description: Polje čiji je prag prekoračen
        enum: [temperature, humidity, co, smoke]
    messages:
      event:
        $ref: '#/components/messages/Event'

operations:
  consumeReading:
    action: receive
    channel:
      $ref: '#/channels/readings'
    title: Prijem očitavanja
    description: Pretplata na `iots/readings/+`, QoS 1, trajna sesija (clean_session=false).
    messages:
      - $ref: '#/channels/readings/messages/reading'

  publishEvent:
    action: send
    channel:
      $ref: '#/channels/events'
    title: Objavljivanje događaja
    description: |
      Objavljuje se jedan događaj po prekoračenom polju. QoS 1, retain = false.
      Ako je vrednost prešla i `critical` prag, `severity` je `CRITICAL`, inače `WARNING`.
    messages:
      - $ref: '#/channels/events/messages/event'

components:
  messages:
    Reading:
      name: Reading
      title: Očitavanje sa IoT senzora
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReadingPayload'

    Event:
      name: Event
      title: Događaj o prekoračenju praga
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventPayload'
      examples:
        - name: primer
          payload:
            eventId: '1c:bf:ce:15:ec:4d-temperature-4'
            type: THRESHOLD_EXCEEDED
            severity: CRITICAL
            deviceId: '1c:bf:ce:15:ec:4d'
            field: temperature
            value: 30.4
            unit: C
            threshold: 29.0
            operator: gt
            exceededBy: 1.4
            readingId: 4
            readingTs: '2020-07-12T00:01:34Z'
            detectedAt: '2026-09-02T07:01:35Z'
            location:
              lat: 44.8125
              lon: 20.4612

  schemas:
    ReadingPayload:
      type: object
      required: [id, deviceId, ts]
      properties:
        id: { type: integer, format: int64 }
        deviceId: { type: string }
        ts: { type: string, format: date-time }
        temperature: { type: number, format: double }
        humidity: { type: number, format: double }
        co: { type: number, format: double }
        smoke: { type: number, format: double }
        location:
          $ref: '#/components/schemas/Location'

    EventPayload:
      type: object
      required: [eventId, type, severity, deviceId, field, value, threshold, detectedAt]
      properties:
        eventId:
          type: string
          description: 'Identifikator događaja: {deviceId}-{field}-{readingId}'
        type:
          type: string
          enum: [THRESHOLD_EXCEEDED]
          description: Tip događaja
        severity:
          type: string
          enum: [WARNING, CRITICAL]
        deviceId:
          type: string
        field:
          type: string
          enum: [temperature, humidity, co, smoke]
        value:
          type: number
          format: double
          description: Izmerena vrednost koja je okinula događaj
        unit:
          type: string
          description: Jedinica mere
        threshold:
          type: number
          format: double
          description: Prag koji je prekoračen
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        exceededBy:
          type: number
          format: double
          description: Apsolutna razlika izmerene vrednosti i praga
        readingId:
          type: integer
          format: int64
          description: Identifikator očitavanja u bazi
        readingTs:
          type: string
          format: date-time
          description: Vreme očitavanja
        detectedAt:
          type: string
          format: date-time
          description: Vreme detekcije događaja
        location:
          $ref: '#/components/schemas/Location'

    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

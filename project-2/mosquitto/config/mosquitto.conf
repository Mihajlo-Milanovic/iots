# Mosquitto konfiguracija za IoTS Projekat 2

# TCP listener - mikroservisi (DataManager, EventManager)
listener 1883
protocol mqtt

# WebSocket listener - MqttClient web aplikacija u pregledaču
listener 9001
protocol websockets

# Samo za razvoj/demonstraciju; u produkciji koristiti autentifikaciju
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
